# start config
env_backend: real_robot
env_id: pick_and_place
obs:
  state: true
  rgb: [wrist]
  depth: []
  image_size: [224, 224]
real_robot:
  # Offline shape construction only; preparation replaces this entire block.
  remote: 127.0.0.1:50051
  num_joints: 7
  action_mode: cartesian_delta
  cartesian_semantics: current
  xyz_scale_m: 0.05
  rot_scale_rad: 0.3
  gripper_in_action: true
  state_fields: [tcp_pose, tcp_vel, joint_pos, joint_vel]
  control_hz: 10
  max_episode_steps: 200
demo_dataset_paths: [local/first-demo]
# plain_conv with the default flatten pooling only fits 128x128 or 64x64 images;
# gap pooling fits any image size, here 224x224.
encoder:
  plain_conv_pooling: gap
log_dir: local/bc-runs
exp_name: first-bc
log_type: tensorboard
device: cpu
buffer_device: cpu
buffer_size: 64
batch_size: 4
num_offline_steps: 4
log_freq: 1
checkpoint_freq: 2
save_final_checkpoint: true
seed: 1
# end config
