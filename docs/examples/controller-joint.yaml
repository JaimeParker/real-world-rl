# 教程片段：joint_controller: trajectory_impedance 的 station 字段（其余字段见 station.yaml）。
type: franka
name: franka
arm_backend: franky
robot_ip: REPLACE_WITH_FCI_IP
gripper:
  backend: franky
  max_width_m: 0.08
  mode: binary
# start controller
joint_controller: trajectory_impedance   # 默认 impedance；GELLO 关节遥操作选这个
robot_model: fr3                         # Desk 系统 4.x 填 panda，5.x 填 fr3
realtime: enforce                        # 建议 PREEMPT_RT；普通内核填 enforce 会连接失败
joint_trajectory: {}                     # 空 = 全部用 joint_controller 的默认值（按 robot_model 取限位）
# end controller
# start override
joint_trajectory:                        # 只写要改的键；其余仍是默认值
  max_acceleration: [6.0, 6.0, 6.0, 6.0, 6.0, 6.0, 6.0]   # rad/s^2；越大跟随滞后越小
  command_timeout_s: 0.5                                  # s；这么久没有新目标就受控停下
# end override
