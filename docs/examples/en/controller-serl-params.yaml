# Tutorial snippet: explicit serl: block (all defaults; omitting it or setting null has the same effect).
type: franka
name: franka
arm_backend: franky
robot_ip: REPLACE_WITH_FCI_IP
gripper:
  backend: franky
  max_width_m: 0.08
  mode: binary
cartesian_controller: serl
robot_model: fr3
realtime: enforce
# start serl
serl:
  translational_stiffness: 2000.0
  translational_damping: 89.0
  rotational_stiffness: 150.0
  rotational_damping: 7.0
  nullspace_stiffness: 0.2
  joint1_nullspace_stiffness: 100.0
  translational_clip_x: 0.01
  translational_clip_y: 0.01
  translational_clip_z: 0.01
  translational_clip_neg_x: 0.01
  translational_clip_neg_y: 0.01
  translational_clip_neg_z: 0.01
  rotational_clip_x: 0.05
  rotational_clip_y: 0.05
  rotational_clip_z: 0.05
  rotational_clip_neg_x: 0.05
  rotational_clip_neg_y: 0.05
  rotational_clip_neg_z: 0.05
  translational_Ki: 0.0
  rotational_Ki: 0.0
# end serl
# start load
# When the gripper holds a tool not registered in Desk (example numbers; replace with measurements):
load:
  mass_kg: 0.2                        # Additional payload only; do not count the Franka Hand already registered in Desk twice
  center_of_mass_m: [0.0, 0.0, 0.05]  # Flange frame, m
  inertia: [[0.0002, 0.0, 0.0], [0.0, 0.0002, 0.0], [0.0, 0.0, 0.0001]]  # About the center of mass, kg·m²
# end load
