# Tutorial snippet: station fields for cartesian_controller: serl.
type: franka
name: franka
arm_backend: franky
robot_ip: REPLACE_WITH_FCI_IP
gripper:
  backend: franky
  max_width_m: 0.08
  mode: binary
# start controller
cartesian_controller: serl        # SERL Cartesian impedance controller + 10 s joint reset
robot_model: fr3                  # Selects the joint-limit table for SERL joint reset
realtime: enforce                 # Original SERL ran with realtime_config: enforce
control: null                     # Do not set impedance Cartesian gains; they have no effect in serl mode
# end controller
# start serl-null
serl: null                        # null = SERL compliance_param.cfg defaults (table below)
# end serl-null
# start recover
serl_auto_recover:                # null is equivalent to the following two lines
  enabled: true
  max_per_episode: 5
# end recover
# start load
load: null                        # null: retain the end-effector payload set in Desk
# end load
