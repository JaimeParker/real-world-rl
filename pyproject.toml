[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "real-world-rl"
version = "0.0.1"
description = "Real-world RL orchestration for rl-garden: ActorLoop/LearnerLoop, the franka_real env backend, and SERL/HIL-SERL training loops. Imports rl_garden as a library; overrides/extends it here rather than living inside its repo."
requires-python = ">=3.10"
dependencies = [
    # Supplied from local checkouts in the same pip invocation (scripts/install.sh).
    # These versions are not commit locks; development uses the pinned submodule.
    "rl_garden==0.0.1",
    "torch>=2.1",
    "numpy",
    "scipy>=1.10",
    "gymnasium>=0.29",
    "tyro",
    "requests",
    "packaging>=23",
    # Device layer for the generic real_robot env backend (envs/real_robot).
    # Lives in this repository under robot_infra/ (torch-free). For development:
    #   pip install -e rl-garden -e robot_infra -e .
    "rlgarden-robot-infra==0.0.1",
]

[project.optional-dependencies]
# Franka bridge client + teleop intervention wrapper need the sibling
# robot_infra/ distribution installed (controller/real, teleop/*). ROS
# itself, required only on the machine running
# robot_infra/controller/real/franka_bridge.py, is not pip-installable --
# see that module's docstring.
robot-infra = ["rlgarden-robot-infra==0.0.1"]
# collect_data.py's global success/failure keyboard listener.
reward-collection = ["pynput"]
# examples/record_teleop_wsrl.py, run_teleop_demo.py: ManiSkill sim envs.
examples = ["mani_skill"]
dev = ["pytest", "scipy"]
# The daemon route needs grpc even when the main workflow runs directly on the NUC.
# doctor --install-sdk selects/reinstalls the wheel for the robot server version.
franka-gello = [
    "rlgarden-robot-infra[franky,gello,gello-events,grpc]==0.0.1",
    "franky-control",
    "websockets>=13",
]
spacemouse = ["rlgarden-robot-infra[spacemouse]==0.0.1"]
test = ["pytest", "opencv-python-headless", "ipython", "torchvision", "grpcio>=1.60"]

[project.scripts]
rwrl = "real_world_rl.cli:main"
real-world-rl-train = "real_world_rl.training.__main__:main"
real-world-rl-record = "real_world_rl.demos.__main__:main"
real-world-rl-deploy = "real_world_rl.deploy:run_cli"
real-world-rl-collect-reward = "real_world_rl.reward.collect_data:main"

[project.entry-points."rlgarden.env_backends"]
franka_real = "real_world_rl.envs.backends.franka_real"
real_robot = "real_world_rl.envs.backends.real_robot"
real_robot_bimanual = "real_world_rl.envs.backends.real_robot_bimanual"

[project.entry-points."rlgarden.algorithms"]
real_world = "real_world_rl.training.rlgarden_algorithms"

[tool.setuptools.packages.find]
include = ["real_world_rl*"]

[tool.setuptools.package-data]
real_world_rl = ["py.typed"]
