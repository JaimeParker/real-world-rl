[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rlgarden-real-world"
version = "0.0.1"
description = "Real-world RL orchestration for rl-garden: ActorLoop/LearnerLoop, the franka_real env backend, and SERL/HIL-SERL training loops. Imports rl_garden as a library; overrides/extends it here rather than living inside its repo."
requires-python = ">=3.10"
dependencies = [
    # Non-dev installs take rl-garden from GitHub. For development the rl-garden/
    # submodule pins the commit the tests pass against:
    #   pip install -e rl-garden -e robot_infra -e .
    "rl_garden @ git+https://github.com/JaimeParker/rl-garden.git",
    "torch>=2.1",
    "numpy",
    "gymnasium>=0.29",
    "tyro",
    "requests",
    # Device layer for the generic real_robot env backend (envs/real_robot).
    # Lives in this repository under robot_infra/ (torch-free). For development:
    #   pip install -e rl-garden -e robot_infra -e .
    "rlgarden-robot-infra @ git+https://github.com/JaimeParker/rlgarden-real-world.git#subdirectory=robot_infra",
]

[project.optional-dependencies]
# Franka bridge client + teleop intervention wrapper need the sibling
# robot_infra/ distribution installed (controller/real, teleop/*). ROS
# itself, required only on the machine running
# robot_infra/controller/real/franka_bridge.py, is not pip-installable --
# see that module's docstring.
robot-infra = ["rlgarden-robot-infra @ git+https://github.com/JaimeParker/rlgarden-real-world.git#subdirectory=robot_infra"]
# collect_data.py's global success/failure keyboard listener.
reward-collection = ["pynput"]
# examples/record_teleop_wsrl.py, run_teleop_demo.py: ManiSkill sim envs.
examples = ["mani_skill"]
dev = ["pytest", "scipy"]

[project.scripts]
rlgarden-real-train = "rl_garden_real_world.training.__main__:main"
rlgarden-real-record = "rl_garden_real_world.demos.__main__:main"
rlgarden-real-deploy = "rl_garden_real_world.deploy:run_cli"
rlgarden-real-collect-reward = "rl_garden_real_world.reward.collect_data:main"

[project.entry-points."rlgarden.env_backends"]
franka_real = "rl_garden_real_world.envs.backends.franka_real"
real_robot = "rl_garden_real_world.envs.backends.real_robot"
real_robot_bimanual = "rl_garden_real_world.envs.backends.real_robot_bimanual"

[project.entry-points."rlgarden.algorithms"]
real_world = "rl_garden_real_world.training.rlgarden_algorithms"

[tool.setuptools.packages.find]
include = ["rl_garden_real_world*"]

[tool.setuptools.package-data]
rl_garden_real_world = ["py.typed"]
