# robot_infra station config, written by `python -m robot_infra.setup`.
# The daemon, the doctor and discovery find it without --config (first match wins):
#   $ROBOT_INFRA_CONFIG, ./local/station.yaml, ~/.config/robot_infra/station.yaml
# Edit it by hand, or regenerate it with `python -m robot_infra.setup --from <this file>`
# (add `--only cameras|teleop|daemon` to redo one section). Check it with
# `python -m robot_infra.doctor`, serve it with `python -m robot_infra.server`.
#
# Example: two Franka Pandas (left, right), each with its own GELLO leader arm and wrist
# camera, plus a front camera on the right robot's daemon. Serials, ports and calibration
# values are placeholders: generate your own with `python -m robot_infra.setup`.
#
# Several robots: `python -m robot_infra.server` starts one daemon process per robot, each on
# its daemon.bind; `--robot <name>` serves or checks a single one.
robots:
  left:
    type: franka                  # registered robot type
    name: left
    arm_backend: franky  # franky (libfranka) | serl_http (legacy ROS1 bridge) | fake
    robot_ip: 172.16.0.2        # FCI IP set in Desk
    bridge_url: http://127.0.0.1:5000    # serl_http only: URL of controller/real/franka_bridge.py
    realtime: ignore        # ignore | enforce (enforce needs a PREEMPT_RT kernel)
    relative_dynamics_factor: 0.2  # franky velocity/acc/jerk scale for move_to_*
    home_joints: [0.0, -0.785, 0.0, -2.356, 0.0, 1.571, 0.785]  # 7 values, rad
    # Safety limits, enforced by the arm (and so by the daemon): servo targets are clipped,
    # move_to_* targets outside them are refused. null = no limit (not recommended).
    safety_box: [0.3, -0.3, 0.05, 0.7, 0.3, 0.6]  # [xmin, ymin, zmin, xmax, ymax, zmax] m, base frame (tcp_pose = O_T_EE); must contain the home pose; suggested [0.3, -0.3, 0.05, 0.7, 0.3, 0.6]
    joint_limits: [[-2.8973, 2.8973], [-1.7628, 1.7628], [-2.8973, 2.8973], [-3.0718, -0.0698], [-2.8973, 2.8973], [-0.0175, 3.7525], [-2.8973, 2.8973]]  # 7 [lo, hi] pairs, rad (default: Panda datasheet); home_joints must lie inside
    max_delta_per_step: {xyz_m: 0.05, joint_rad: 0.04}  # servo step cap from the measured state; default {xyz_m: 0.05, joint_rad: 0.04}
    claim: true              # the daemon takes an exclusive per-host lock on this robot
    gripper:
      backend: franky        # franky | serl_http | fake (match arm_backend)
      max_width_m: 0.08
      mode: binary              # binary | continuous
      binary_threshold: 0.5  # binary mode: an action > threshold opens
      shares_arm_session: false  # false: the Franka Hand opens its own connection
    cameras:                      # serials from `python -m robot_infra.discovery`
      - name: wrist_left            # observation key on the actor side (--obs.rgb)
        backend: realsense      # realsense | fake
        serial: "123422070001"        # "" = the only attached camera; required when more are plugged in
        width: 640
        height: 480
        fps: 30
        enable_depth: false
    teleop:                       # GELLO leader arm (extra `gello`; `gello-events` for event_device)
      name: gello              # the daemon serves teleop.<name>.read / teleop.<name>.reset
      backend: gello
      hold_s: 0.0          # keep intervening this long after the last activity
      options:
        port: /dev/serial/by-id/usb-FTDI_USB__-__Serial_Converter_LEFT0000-if00-port0            # /dev/serial/by-id/... of the U2D2 / OpenRB-150
        baudrate: 57600    # must match the servos; never written to their EEPROM
        joint_ids: [1, 2, 3, 4, 5, 6, 7]  # servo ids of the arm joints, in the Panda's joint order
        joint_offsets_rad: [0.0, 0.0, 3.1416, 3.1416, 3.1416, 4.7124, 0.0]  # q = wrap((raw - offset) * sign); from the calibration
        joint_signs: [1, -1, 1, -1, 1, 1, 1]  # +1 or -1 per joint; from the calibration
        wrap_centers_rad: [0.0, 0.0, 0.0, -1.5708, 0.0, 1.8675, 0.0]  # q wraps into [c - pi, c + pi); midpoints of the joint limits
        gripper_id: 8  # null = no gripper channel
        gripper_open_rad: 3.5  # raw angle of the released trigger
        gripper_closed_rad: 4.4  # raw angle of the squeezed trigger
        gripper_binarize_threshold: 0.5  # null = continuous width
        intervention: always  # always (every poll intervenes) | toggle (event_keys.toggle starts/stops)
        event_device: null  # null, or /dev/input/by-id/...-event-kbd (pedal or keyboard)
        event_keys: {toggle: KEY_SPACE, episode_end: KEY_ESC, success: KEY_S, failure: KEY_F, rerecord: KEY_R}  # evdev key names; toggle flips on key-down, the rest are events
        poll_interval_s: 0.0  # sleep before each bus read
    daemon:                       # read by `python -m robot_infra.server`; not part of the robot config
      bind: 0.0.0.0:50051              # host:port this robot's daemon listens on
      token: null            # shared secret clients must send; null = none
  right:
    type: franka                  # registered robot type
    name: right
    arm_backend: franky  # franky (libfranka) | serl_http (legacy ROS1 bridge) | fake
    robot_ip: 172.16.1.2        # FCI IP set in Desk
    bridge_url: http://127.0.0.1:5000    # serl_http only: URL of controller/real/franka_bridge.py
    realtime: ignore        # ignore | enforce (enforce needs a PREEMPT_RT kernel)
    relative_dynamics_factor: 0.2  # franky velocity/acc/jerk scale for move_to_*
    home_joints: [0.0, -0.785, 0.0, -2.356, 0.0, 1.571, 0.785]  # 7 values, rad
    # Safety limits, enforced by the arm (and so by the daemon): servo targets are clipped,
    # move_to_* targets outside them are refused. null = no limit (not recommended).
    safety_box: [0.3, -0.3, 0.05, 0.7, 0.3, 0.6]  # [xmin, ymin, zmin, xmax, ymax, zmax] m, base frame (tcp_pose = O_T_EE); must contain the home pose; suggested [0.3, -0.3, 0.05, 0.7, 0.3, 0.6]
    joint_limits: [[-2.8973, 2.8973], [-1.7628, 1.7628], [-2.8973, 2.8973], [-3.0718, -0.0698], [-2.8973, 2.8973], [-0.0175, 3.7525], [-2.8973, 2.8973]]  # 7 [lo, hi] pairs, rad (default: Panda datasheet); home_joints must lie inside
    max_delta_per_step: {xyz_m: 0.05, joint_rad: 0.04}  # servo step cap from the measured state; default {xyz_m: 0.05, joint_rad: 0.04}
    claim: true              # the daemon takes an exclusive per-host lock on this robot
    gripper:
      backend: franky        # franky | serl_http | fake (match arm_backend)
      max_width_m: 0.08
      mode: binary              # binary | continuous
      binary_threshold: 0.5  # binary mode: an action > threshold opens
      shares_arm_session: false  # false: the Franka Hand opens its own connection
    cameras:                      # serials from `python -m robot_infra.discovery`
      - name: wrist_right            # observation key on the actor side (--obs.rgb)
        backend: realsense      # realsense | fake
        serial: "123422070002"        # "" = the only attached camera; required when more are plugged in
        width: 640
        height: 480
        fps: 30
        enable_depth: false
      - name: front            # observation key on the actor side (--obs.rgb)
        backend: realsense      # realsense | fake
        serial: "123422070003"        # "" = the only attached camera; required when more are plugged in
        width: 640
        height: 480
        fps: 30
        enable_depth: false
    teleop:                       # GELLO leader arm (extra `gello`; `gello-events` for event_device)
      name: gello              # the daemon serves teleop.<name>.read / teleop.<name>.reset
      backend: gello
      hold_s: 0.0          # keep intervening this long after the last activity
      options:
        port: /dev/serial/by-id/usb-FTDI_USB__-__Serial_Converter_RIGHT000-if00-port0            # /dev/serial/by-id/... of the U2D2 / OpenRB-150
        baudrate: 57600    # must match the servos; never written to their EEPROM
        joint_ids: [1, 2, 3, 4, 5, 6, 7]  # servo ids of the arm joints, in the Panda's joint order
        joint_offsets_rad: [0.0, 0.0, 3.1416, 3.1416, 3.1416, 4.7124, 0.0]  # q = wrap((raw - offset) * sign); from the calibration
        joint_signs: [1, -1, 1, -1, 1, 1, 1]  # +1 or -1 per joint; from the calibration
        wrap_centers_rad: [0.0, 0.0, 0.0, -1.5708, 0.0, 1.8675, 0.0]  # q wraps into [c - pi, c + pi); midpoints of the joint limits
        gripper_id: 8  # null = no gripper channel
        gripper_open_rad: 3.5  # raw angle of the released trigger
        gripper_closed_rad: 4.4  # raw angle of the squeezed trigger
        gripper_binarize_threshold: 0.5  # null = continuous width
        intervention: always  # always (every poll intervenes) | toggle (event_keys.toggle starts/stops)
        event_device: null  # null, or /dev/input/by-id/...-event-kbd (pedal or keyboard)
        event_keys: {toggle: KEY_SPACE, episode_end: KEY_ESC, success: KEY_S, failure: KEY_F, rerecord: KEY_R}  # evdev key names; toggle flips on key-down, the rest are events
        poll_interval_s: 0.0  # sleep before each bus read
    daemon:                       # read by `python -m robot_infra.server`; not part of the robot config
      bind: 0.0.0.0:50052              # host:port this robot's daemon listens on
      token: null            # shared secret clients must send; null = none
