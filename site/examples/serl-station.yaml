# 教程片段：合入 local/station.yaml 顶层（与 type、robot_ip 同级）。
# start head
type: franka
name: franka
arm_backend: franky
robot_ip: REPLACE_WITH_FCI_IP
# end head
# start controller
cartesian_controller: serl    # impedance（默认）| internal | serl
realtime: enforce             # serl 和 internal 都希望用实时内核
robot_model: fr3              # panda（Franka Emika Robot，系统 4.x）| fr3（Franka Research 3，系统 5.x）
# end controller
# start serl
serl:                         # 省略的键保持 SERL compliance_param.cfg 默认值
  translational_stiffness: 2000.0
  translational_damping: 89.0
  rotational_stiffness: 150.0
  rotational_damping: 7.0
  nullspace_stiffness: 0.2
  joint1_nullspace_stiffness: 100.0
  translational_clip_x: 0.01
  translational_clip_y: 0.01
  translational_clip_z: 0.01
  translational_clip_neg_x: 0.01
  translational_clip_neg_y: 0.01
  translational_clip_neg_z: 0.01
  rotational_clip_x: 0.05
  rotational_clip_y: 0.05
  rotational_clip_z: 0.05
  rotational_clip_neg_x: 0.05
  rotational_clip_neg_y: 0.05
  rotational_clip_neg_z: 0.05
  translational_Ki: 0.0
  rotational_Ki: 0.0
# end serl
# start recover
serl_auto_recover:            # null 等同于下面两行
  enabled: true
  max_per_episode: 5
# end recover
# start load
load: null                    # null：保留 Desk 里设置的末端负载
# 手爪夹着 Desk 里没登记的工具时写成（示例数字，按实测替换）：
# load:
#   mass_kg: 0.2                        # 只写额外负载，Desk 已登记的 Franka Hand 不要重复算
#   center_of_mass_m: [0.0, 0.0, 0.05]  # 法兰坐标系，m
#   inertia: [[0.0002, 0.0, 0.0], [0.0, 0.0002, 0.0], [0.0, 0.0, 0.0001]]  # 绕质心，kg·m²
# end load
# start gripper
gripper:
  backend: franky
  max_width_m: 0.08
  mode: binary
  binary_threshold: 0.5
  shares_arm_session: false
  speed_m_s: 0.3              # null = 0.3（HIL-SERL）
  grasp_force_n: 130.0        # null = 130，最大 130 N（HIL-SERL）
  close_width_m: 0.01         # null = 0.01（HIL-SERL）
  open_width_m: null          # null = 完全张开（HIL-SERL）
# end gripper
