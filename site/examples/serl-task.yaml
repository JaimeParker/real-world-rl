# 实验 preset（例如 local/task-serl.yaml）：task.yaml 加上 SERL 参数档。
# start observations
env_backend: real_robot
env_id: pick_and_place
obs:
  state: true
  rgb: [wrist]
  depth: []
  image_size: [128, 128]
# end observations
real_robot:
  # start action
  num_joints: 7
  action_mode: cartesian_delta
  xyz_scale_m: 0.05
  rot_scale_rad: 0.3
  gripper_in_action: true
  state_fields: [tcp_pose, tcp_vel, joint_pos, joint_vel]
  control_hz: 10
  max_episode_steps: 200
  # end action
  # start reset
  # home 沿用 station.home_joints；默认任务为 none，reset 归位并开爪。
  reset_settle_s: 0.5
  # end reset
  # start profiles
  serl_profiles:
    gentle:                   # 自己取的名字；只写要改的键
      translational_stiffness: 1000
      translational_clip_x: 0.005
      translational_clip_y: 0.005
      translational_clip_z: 0.005
      translational_clip_neg_x: 0.005
      translational_clip_neg_y: 0.005
      translational_clip_neg_z: 0.005
  # end profiles
